function subtitleFor(screen){return ({overview:t('A clear view of your transport activity.','رؤية واضحة لجميع عمليات النقل.'),marketplace:t('Discover available loads and connect with verified transport capacity.','اكتشف الحمولات المتاحة وتواصل مع ناقلين موثوقين.'),shipments:t('Follow bookings, shipment status and delivery progress.','تابع الحجوزات وحالة الشحنات وتقدم التسليم.'),trips:t('Coordinate drivers, milestones and delivery evidence.','نسّق السائقين ومراحل الرحلة وإثبات التسليم.'),fleet:t('Manage vehicles, trailers, drivers and availability.','أدر المركبات والمقطورات والسائقين وحالة التوفر.'),messages:t('Keep every shipment conversation in one place.','اجمع جميع محادثات الشحنات في مكان واحد.'),finance:t('Track agreed rates, invoices and settlement status.','تابع الأسعار المتفق عليها والفواتير وحالة التسوية.'),create:t('Enter the transport requirement and publish it to eligible carriers.','أدخل متطلبات النقل وانشرها للناقلين المؤهلين.')})[screen]||''}

function shell(){document.documentElement.lang=state.lang;document.documentElement.dir=state.lang==='ar'?'rtl':'ltr';let html=`<div class="app ${state.lang==='ar'?'rtl':''}"><aside class="sidebar"><div class="brand"><div class="brand-mark">T</div><div><div class="brand-name">TRUCKLINK</div><div class="brand-sub">FREIGHT NETWORK</div></div></div><div class="nav-label">${t('WORKSPACE','مساحة العمل')}</div><nav class="nav">${navItems.map(n=>`<button class="${state.screen===n[0]?'active':''}" onclick="go('${n[0]}')">${icon(n[1])}<span>${t(n[2],n[3])}</span></button>`).join('')}</nav><div class="nav-spacer"></div><div class="sidebar-bottom"><div class="support"><div class="bubble">${icon('chat')}</div><div><b>${t('Need help?','هل تحتاج مساعدة؟')}</b><small>${t('Talk to TruckLink support','تواصل مع دعم تراك لينك')}</small></div></div></div></aside><main class="main"><header class="topbar"><div class="top-left"><span class="crumb">${t('Workspace','مساحة العمل')} / ${titleFor(state.screen)}</span><span class="demo-pill"><i class="demo-dot"></i>${t('DEMO ENVIRONMENT','بيئة تجريبية')}</span></div><div class="top-actions"><select class="select-role" aria-label="Demo role" onchange="setRole(this.value)"><option value="shipper" ${state.role==='shipper'?'selected':''}>${t('Shipper view','واجهة صاحب الشحنة')}</option><option value="carrier" ${state.role==='carrier'?'selected':''}>${t('Carrier view','واجهة الناقل')}</option><option value="driver" ${state.role==='driver'?'selected':''}>${t('Driver view','واجهة السائق')}</option><option value="ops" ${state.role==='ops'?'selected':''}>${t('Operations view','واجهة التشغيل')}</option></select><button class="lang-btn" onclick="toggleLang()">${state.lang==='en'?'عربي':'EN'}</button><button class="icon-btn" onclick="notifyDemo()" title="Notifications">${icon('bell')}<i class="ping"></i></button><div class="avatar">${state.role==='driver'?'SA':'AH'}</div></div></header><div class="content">${screenContent()}</div></main></div>`;document.get function routePanel(){return `<section class="panel"><div class="panel-head"><div><h3 class="panel-title">${t('Network activity','حركة الشبكة')}</h3><div class="panel-sub">${t('Illustrative Oman route activity · demo data','حركة توضيحية للمسارات في عُمان · بيانات تجريبية')}</div></div><span class="badge green">${t('Live demo','عرض تجريبي')}</span></div><div class="panel-body"><div class="route-visual"><svg class="route-svg" viewBox="0 0 640 190" preserveAspectRatio="none"><path d="M86 153 C170 143 168 100 265 103 S402 56 543 49" stroke="#b9dcd3" stroke-width="3" fill="none" stroke-dasharray="6 7"/><path d="M86 153 C170 143 168 100 265 103 S402 56 543 49" stroke="#0e9d8b" stroke-width="2" fill="none"/><circle cx="86" cy="153" r="7" fill="#0e9d8b" stroke="white" stroke-width="3"/><circle cx="543" cy="49" r="7" fill="#dda34c" stroke="white" stroke-width="3"/><circle cx="265" cy="103" r="4" fill="#0e9d8b"/><circle cx="410" cy="72" r="4" fill="#0e9d8b"/></svg><div class="route-tag origin">${t('MUSCAT','مسقط')}<small>${t('3 active trips','٣ رحلات نشطة')}</small></div><div class="route-tag dest">${t('SOHAR','صحار')}<small>${t('2 approaching','رحلتان في الطريق')}</small></div></div><div class="map-legend"><span><i class="legend-dot teal"></i>${t('Active movement','حركة نشطة')}</span><span><i class="legend-dot gold"></i>${t('Destination hub','وجهة')}</span><span>${t('Illustrative route, not navigation','مسار توضيحي وليس للملاحة')}</span></div></div></section>`}
function activityPanel(){return `<section class="panel"><div class="panel-head"><div><h3 class="panel-title">${t('Recent activity','آخر الأنشطة')}</h3><div class="panel-sub">${t('Updates from your transport network','تحديثات من شبكة النقل')}</div></div><button class="text-link" onclick="go('shipments')">${t('View all','عرض الكل')} →</button></div><div class="panel-body"><div class="list"><div class="list-row"><div class="row-icon">${icon('check')}</div><div class="row-main"><div class="row-title">${t('Load TL-2398 picked up','تم تحميل الشحنة TL-2398')}</div><div class="row-meta">${t('Salim Al Balushi · 12 minutes ago','سالم البلوشي · قبل ١٢ دقيقة')}</div></div>${badge('in_progress')}</div><div class="list-row"><div class="row-icon">${icon('file')}</div><div class="row-main"><div class="row-title">${t('New quotation received','تم استلام عرض سعر جديد')}</div><div class="row-meta">${t('Load TL-2408 · Al Wadi Transport','الشحنة TL-2408 · الوادي للنقل')}</div></div><span class="badge amber">${t('Review','مراجعة')}</span></div><div class="list-row"><div class="row-icon">${icon('users')}</div><div class="row-main"><div class="row-title">${t('Carrier verification completed','اكتمل التحقق من الناقل')}</div><div class="row-meta">${t('Oman Horizon Logistics','آفاق عُمان للخدمات اللوجستية')}</div></div>${badge('verified')}</div></div></div></section>`}
function overview(){let r=state.role;let intro=r==='driver'?t('Your next delivery, clearly organised.','رحلتك القادمة منظمة وواضحة.'):r==='carrier'?t('Manage your capacity and find the right loads.','أدر طاقتك التشغيلية وابحث عن الحمولات المناسبة.'):r==='ops'?t('Monitor the network and resolve exceptions.','راقب الشبكة وعالج الحالات الاستثنائية.'):t('Move every shipment with more visibility and control.','أدر كل شحنة بمزيد من الوضوح والتحكم.');let actions=`<button class="btn" onclick="go('trips')">${icon('route')}${t('View trips','عرض الرحلات')}</button><button class="btn primary" onclick="go('create')">${icon('plus')}${t('Create shipment','إنشاء شحنة')}</button>`;return head(t('Good morning, Abdullah','صباح الخير، عبدالله'),intro,actions)+stats()+`<div class="content-grid">${routePanel()}${activityPanel()}</div><section class="panel"><div class="panel-head"><div><h3 class="panel-title">${t('Priority shipments','الشحنات ذات الأولوية')}</h3><div class="panel-sub">${t('A quick view of loads that need attention','نظرة سريعة على الشحنات التي تحتاج إلى متابعة')}</div></div><button class="text-link" onclick="go('shipments')">${t('All shipments','جميع الشحنات')} →</button></div>${shipmentTable()}</section><div class="section-space demo-note">${t('Investor demo: Use the role selector above to switch between Shipper, Carrier, Driver and Operations perspectives. All names, trips, prices and statuses shown here are sample data.','عرض المستثمر: استخدم قائمة الأدوار أعلاه للتنقل بين واجهات صاحب الشحنة والناقل والسائق والتشغيل. جميع الأسماء والرحلات والأسعار والحالات المعروضة بيانات تجريبية.')}</div>`}
function shipmentTable(){let rows=[{id:'TL-2398',route:'Muscat → Sohar',routeAr:'مسقط ← صحار',cargo:'Retail stock',cargoAr:'بضائع تجزئة',status:'in_progress',rate:'OMR 165',date:'Today, 09:00'},{id:'TL-2396',route:'Sohar → Nizwa',routeAr:'صحار ← نزوى',cargo:'Building materials',cargoAr:'مواد بناء',status:'booked',rate:'OMR 145',date:'Today, 12:30'},{id:'TL-2391',route:'Duqm → Muscat',routeAr:'الدقم ← مسقط',cargo:'Industrial equipment',cargoAr:'معدات صناعية',status:'delivered',rate:'OMR 420',date:'Yesterday'}];return `<div class="table-wrap"><table class="data-table"><thead><tr><th>${t('Shipment','الشحنة')}</th><th>${t('Route','المسار')}</th><th>${t('Cargo','نوع الحمولة')}</th><th>${t('Status','الحالة')}</th><th>${t('Rate','السعر')}</th><th>${t('Pickup','موعد التحميل')}</th></tr></thead><tbody>${rows.map(x=>`<tr onclick="showShipment('${x.id}')"><td><span class="primary-cell">${x.id}</span><span class="secondary-cell">${t('Verified shipper','صاحب شحنة موثق')}</span></td><td>${t(x.route,x.routeAr)}</td><td>${t(x.cargo,x.cargoAr)}</td><td>${badge(x.status)}</td><td class="primary-cell">${x.rate}</td><td>${t(x.date,x.date==='Today, 09:00'?'اليوم، ٠٩:٠٠':x.date==='Today, 12:30'?'اليوم، ١٢:٣٠':'أمس')}</td></tr>`).join('')}</tbody></table></div><div class="table-foot"><span>${t('Showing 3 of 12 shipments','عرض ٣ من ١٢ شحنة')}</span><span>${t('Updated just now','تم التحديث الآن')}</span></div>`}
function market(){let action=state.role==='shipper'?`<button class="btn primary" onclick="go('create')">${icon('plus')}${t('Post a load','نشر حمولة')}</button>`:'';return head(t('Find the right load','اعثر على الحمولة المناسبة'),subtitleFor('marketplace'),action)+`<section class="panel"><div class="panel-head"><div><h3 class="panel-title">${t('Available loads','الحمولات المتاحة')}</h3><div class="panel-sub">${t('Verified shippers · Clear requirements · Indicative rates','شاحنون موثقون · متطلبات واضحة · أسعار استرشادية')}</div></div><span class="badge green">34 ${t('available','متاحة')}</span></div><div class="filterbar"><input class="searchbox" id="load-search" placeholder="${t('Search route, cargo or load ID…','ابحث عن المسار أو الحمولة أو الرقم…')}" oninput="filterLoads(this.value)"/><select class="filter-select" onchange="filterType(this.value)"><option value="all">${t('All equipment','جميع أنواع المعدات')}</option><option value="Flatbed">${t('Flatbed','سطحة')}</option><option value="Curtain-side">${t('Curtain-side','ستارة جانبية')}</option><option value="Lowbed">${t('Lowbed','ناقلة منخفضة')}</option></select><select class="filter-select"><option>${t('Any pickup date','أي موعد تحميل')}</option><option>${t('Today','اليوم')}</option><option>${t('Tomorrow','غداً')}</option></select></div><div class="load-grid" id="load-grid">${loadCards(state.loads)}</div></section><div class="section-space demo-note">${t('Matching demonstration: the system filters by equipment and cargo requirements first, then ranks eligible carriers by availability, distance to pickup, price and service history. This sample does not make a real dispatch.','توضيح المطابقة: يبدأ النظام بتصفية الناقلين حسب نوع المعدات ومتطلبات الحمولة، ثم يرتب المؤهلين حسب التوفر والمسافة إلى موقع التحميل والسعر وسجل الأداء. هذا العرض لا ينفذ عملية إسناد حقيقية.')}</div>`}
function loadCards(arr){if(!arr.length)return `<div class="empty">${t('No loads match these filters.','لا توجد حمولات مطابقة لهذه المرشحات.')}</div>`;return arr.map(l=>`<article class="load-card"><div class="load-top"><span class="load-id">${l.id} · ${l.shipper}</span>${badge(l.status)}</div><div class="load-route"><div class="place">${val(l.from)}<small>${t('Pickup','التحميل')} · ${val(l.pickup)}</small></div><div class="route-arrow">${icon('arrow')}</div><div class="place">${val(l.to)}<small>${t('Delivery','التسليم')} · ${l.distance}</small></div></div><div class="load-facts"><span>▦ <b>${val(l.cargo)}</b></span><span>⚖ <b>${l.weight}</b></span><span>▤ <b>${val(l.type)}</b></span></div><div class="load-bottom"><div><div class="load-price">${l.unit} ${l.rate} <small>${t('offered rate','السعر المعروض')}</small></div><div class="row-meta">${t('Verified company','شركة موثقة')} · ${l.shipper}</div></div><button class="btn small primary" onclick="openOffer('${l.id}')">${state.role==='shipper'?t('View details','عرض التفاصيل'):t('Send offer','إرسال عرض')}</button></div></article>`).join('')}
function filterLoads(q){state.query=q.toLowerCase();let arr=state.loads.filter(l=>[l.id,l.shipper,l.from.en,l.from.ar,l.to.en,l.to.ar,l.cargo.en,l.cargo.ar].join(' ').toLowerCase().includes(state.query));let grid=document.getElementById('load-grid');if(grid)grid.innerHTML=loadCards(arr)}function filterType(type){let q=state.query||'';let arr=state.loads.filter(l=>(type==='all'||l.type.en===type)&&[l.id,l.shipper,l.from.en,l.to.en,l.cargo.en].join(' ').toLowerCase().includes(q));document.getElementById('load-grid').innerHTML=loadCards(arr)}
function shipments(){return head(t('Shipment management','إدارة الشحنات'),subtitleFor('shipments'),`<button class="btn primary" onclick="go('create')">${icon('plus')}${t('New shipment','شحنة جديدة')}</button>`)+`<section class="panel"><div class="panel-head"><div><h3 class="panel-title">${t('All shipments','جميع الشحنات')}</h3><div class="panel-sub">${t('Bookings, delivery milestones and status','الحجوزات ومراحل التسليم والحالة')}</div></div><button class="btn small">${icon('file')}${t('Export','تصدير')}</button></div>${shipmentTable()}</section>`}
function trips(){let p=state.trips[0].progress;let ms=[['Booked','محجوزة'],['At pickup','في موقع التحميل'],['Loaded','تم التحميل'],['In transit','قيد النقل'],['Delivered','تم التسليم']];return head(t('Trip control','إدارة الرحلات'),subtitleFor('trips'),`<button class="btn" onclick="notifyDemo()">${icon('bell')}${t('Trip alerts','تنبيهات الرحلة')}</button>`)+`<div class="two-col"><section class="panel"><div class="panel-head"><div><h3 class="panel-title">${t('Active trip','الرحلة النشطة')} · TR-8812</h3><div class="panel-sub">${t('Assigned driver and equipment','السائق والمعدات المخصصة')}</div></div>${badge('in_progress')}</div><div class="panel-body"><div class="trip-card"><div class="trip-top"><div><div class="eyebrow">${t('CURRENT ASSIGNMENT','الإسناد الحالي')}</div><strong>${t('Muscat → Sohar','مسقط ← صحار')}</strong><div class="row-meta">TL-2398 · ${t('Retail stock · 12 tonnes','بضائع تجزئة · ١٢ طناً')}</div></div><span class="badge blue">${t('On schedule','وفق الجدول')}</span></div><div class="trip-route"><div class="trip-place"><strong>${t('Muscat','مسقط')}</strong><span>${t('Pickup · 09:00','التحميل · ٠٩:٠٠')}</span></div><div class="trip-line"></div><div class="trip-place" style="text-align:end"><strong>${t('Sohar','صحار')}</strong><span>${t('ETA · 15:20','الوصول المتوقع · ١٥:٢٠')}</span></div></div><div class="timeline">${ms.map((m,i)=>`<div class="milestone ${i<p?'done':i===p?'current':''}"><div class="mile-dot"></div><strong>${t(m[0],m[1])}</strong><small>${i===0?'08:15':i===1?'09:02':i===2?'09:35':i===3?'10:10':'—'}</small></div>`).join('')}</div><div class="trip-info"><div class="info-box"><span>${t('Driver','السائق')}</span><strong>Salim Al Balushi</strong></div><div class="info-box"><span>${t('Truck plate','رقم الشاحنة')}</span><strong>OM-4821</strong></div><div class="info-box"><span>${t('Trailer','المقطورة')}</span><strong>TR-882</strong></div></div><div class="trip-actions"><button class="btn primary" onclick="advanceTrip()">${icon('check')}${p>=4? iv></section></div>`}
function fleet(){let trucks=[['OM-4821','Volvo FH 2022','Flatbed · 18 t','Available','متاحة'],['OM-7310','Scania R450 2021','Curtain-side · 24 t','On trip','في رحلة'],['OM-2219','MAN TGX 2023','Lowbed · 30 t','Available','متاحة']];return head(t('Fleet & people','الأسطول والأفراد'),subtitleFor('fleet'),`<button class="btn primary" onclick="showToast(t('Asset form is a prototype interaction.','نموذج إضافة الأصل تجريبي.'))">${icon('plus')}${t('Add asset','إضافة أصل')}</button>`)+`<section class="panel"><div class="panel-head"><div><h3 class="panel-title">${t('Registered equipment','المعدات المسجلة')}</h3><div class="panel-sub">${t('Ownership, compatibility and availability','الملكية والتوافق والتوفر')}</div></div><span class="badge green">${t('Verification enabled','التحقق مفعّل')}</span></div><div class="fleet-grid">${trucks.map((x,i)=>`<div class="fleet-card"><div class="fleet-visual">🚛</div><strong>${x[0]} · ${x[1]}</strong><p>${t(x[2],['سطحة · ١٨ طناً','ستارة جانبية · ٢٤ طناً','ناقلة منخفضة · ٣٠ طناً'][i])}</p><div class="fleet-meta">${badge(i===1?'in_progress':'verified')}<button class="text-link" onclick="showToast(t('Equipment detail opened in demo.','تم فتح تفاصيل المعدة في العرض التجريبي.'))">${t('Details','التفاصيل')} →</button></div></div>`).join('')}</div></section><div class="content-grid section-space"><section class="panel"><div class="panel-head"><div><h3 class="panel-title">${t('Drivers','السائقون')}</h3><div class="panel-sub">${t('Assigned and verified drivers','السائقون المخصصون والموثقون')}</div></div></div><div class="panel-body"><div class="list"><div class="list-row"><div class="avatar">SA</div><div class="row-main"><div class="row-title">Salim Al Balushi</div><div class="row-meta">${t('Heavy vehicle licence · Expires 2027','رخصة مركبة ثقيلة · تنتهي ٢٠٢٧')}</div></div>${badge('verified')}</div><div class="list-row"><div class="avatar">MK</div><div class="row-main"><div class="row-title">Mohammed Al Kindi</div><div class="row-meta">${t('Heavy vehicle licence · Expires 2027','رخصة مركبة ثقيلة · تنتهي ٢٠٢٧')}</div></div>${badge('verified')}</div></div></div></section><section class="panel"><div class="panel-head"><div><h3 class="panel-title">${t('Compliance reminders','تنبيهات الامتثال')}</h3></div></div><div class="panel-body"><div class="action-card"><div class="stat-icon gold">${icon('clock')}</div><div><strong>${t('Insurance renewal approaching','اقتراب موعد تجديد التأمين')}</strong><span>${t('1 asset · due in 21 days','أصل واحد · خلال ٢١ يوماً')}</span></div></div><div class="action-card"><div class="stat-icon teal">${icon('check')}</div><div><strong>${t('All driver profiles verified','جميع ملفات السائقين موثقة')}</strong><span>${t('2 active drivers','سائقان نشطان')}</span></div></div></div></section></div>`}
function messages(){return head(t('Messages & coordination','الرسائل والتنسيق'),subtitleFor('messages'))+`<section class="panel chat-layout"><div class="chat-list"><div class="chat-person active"><div class="avatar">AW</div><div><strong>Al Wadi Transport</strong><small>${t('TL-2398 · 09:18','TL-2398 · ٠٩:١٨')}</small></div></div><div class="chat-person"><div class="avatar">GN</div><div><strong>Gulf North Logistics</strong><small>${t('TL-2408 · Yesterday','TL-2408 · أمس')}</small></div></div><div class="chat-person"><div class="avatar">OM</div><div><strong>Oman Movers</strong><small>${t('General enquiry','استفسار عام')}</small></div></div></div><div class="chat-main"><div class="chat-head"><div class="avatar">AW</div><div><strong style="font-size:12px">Al Wadi Transport</strong><div class="row-meta">${t('Verified carrier · Shipment TL-2398','ناقل موثق · الشحنة TL-2398')}</div></div><span style="margin-left:auto">${badge('verified')}</span></div><div class="chat-messages" id="chat-messages">${state.messages.map(m=>`<div class="message ${m.mine?'mine':''}">${val(m.text)}<small>${m.time}</small></div>`).join('')}</div><div class="chat-compose"><input id="chat-input" placeholder="${t('Write a message…','اكتب رسالة…')}" onkeydown="if(event.key==='Enter')sendMessage()"/><button class="btn primary small" onclick="sendMessage()">${t('Send','إرسال')}</button></div></div></section><div class="section-space demo-note">${t('Conversations are linked to a shipment so that messages, agreed changes and documents remain in the same operational context.','ترتبط المحادثات بالشحنة لضمان بقاء الرسائل والتعديلات المتفق عليها والمستندات ضمن السياق التشغيلي نفسه.')}</div>`}
function finance(){return head(t('Finance & settlements','المالية والتسويات'),subtitleFor('finance'))+`<div class="grid finance-grid">${[['Awaiting invoice','بانتظار الفاتورة','OMR 1,240'],['Under review','قيد المراجعة','OMR 380'],['Settled this month','تمت تسويتها هذا الشهر','OMR 8,650']].map((x,i)=>`<div class="panel finance-card"><span>${t(x[0],x[1])}</span><strong>${x[2]}</strong><div class="row-meta">${i===2?t('Across 42 trips','عبر ٤٢ رحلة'):t('Illustrative demo amount','مبلغ توضيحي تجريبي')}</div></div>`).join('')}</div><section class="panel"><div class="panel-head"><div><h3 class="panel-title">${t('Recent financial records','السجلات المالية الأخيرة')}</h3><div class="panel-sub">${t('Agreed amounts and approval workflow','المبالغ المتفق عليها وسير الموافقات')}</div></div></div><div class="table-wrap"><table class="data-table"><thead><tr><th>${t('Reference','المرجع')}</th><th>${t('Counterparty','الطرف المقابل')}</th><th>${t('Amount','المبلغ')}</th><th>${t('Type','النوع')}</th><th>${t('Status','الحالة')}</th></tr></thead><tbody><tr><td class="primary-cell">INV-DEMO-018</td><td>Al Wadi Transport</td><td>OMR 165</td><td>${t('Carrier payable','مستحق للناقل')}</td><td>${badge('pending')}</td></tr><tr><td class="primary-cell">INV-DEMO-017</td><td>Al Noor Trading</td><td>OMR 420</td><td>${t('Shipper receivable','مستحق من الشاحن')}</td><td>${badge('in_progress')}</td></tr><tr><td class="primary-cell">INV-DEMO-015</td><td>Gulf North Logistics</td><td>OMR 210</td><td>${t('Carrier payable','مستحق للناقل')}</td><td>${badge('delivered')}</td></tr></tbody></table></div></section><div class="section-space demo-note">${t('This prototype does not collect, hold or transfer money. Production payment flows require a licensed payment provider, approved commercial terms and Odoo reconciliation design.','هذا النموذج لا يجمع الأموال أو يحتفظ بها أو يحولها. تتطلب المدفوعات الفعلية مزود دفع مرخصاً وشروطاً تجارية معتمدة وتصميماً للتسوية عبر أودو.')}</div>`}
function create(){return head(t('Create a shipment','إنشاء شحنة'),subtitleFor('create'))+`<section class="panel"><div class="panel-head"><div><h3 class="panel-title">${t('Shipment requirements','متطلبات الشحنة')}</h3><div class="panel-sub">${t('Step 1 of 2 · Route and cargo details','الخطوة ١ من ٢ · تفاصيل المسار والحمولة')}</div></div><span class="badge blue">${t('Draft','مسودة')}</span></div><form id="create-form" onsubmit="createLoad(event)"><div class="form-grid"><div class="field"><label>${t('Pickup city','مدينة التحميل')}</label><select name="from" required><option value="Muscat">${t('Muscat','مسقط')}</option><option value="Sohar">${t('Sohar','صحار')}</option><option value="Duqm">${t('Duqm','الدقم')}</option><option value="Nizwa">${t('Nizwa','نزوى')}</option><option value="Salalah">${t('Salalah','صلالة')}</option></select></div><div class="field"><label>${t('Delivery city','مدينة التسليم')}</label><select name="to" required><option value="Sohar">${t('Sohar','صحار')}</option><option value="Muscat">${t('Muscat','مسقط')}</option><option value="Nizwa">${t('Nizwa','نزوى')}</option><option value="Duqm">${t('Duqm','الدقم')}</option><option value="Salalah">${t('Salalah','صلالة')}</option></select></div><div class="field"><label>${t('Cargo description','وصف الحمولة')}</label><input name="cargo" required placeholder="${t('e.g. Building materials','مثال: مواد بناء')}"/></div><div class="field"><label>${t('Required equipment','المعدة المطلوبة')}</label><select name="type"><option value="Flatbed">${t('Flatbed','سطحة')}</option><option value="Curtain-side">${t('Curtain-side','ستارة جانبية')}</option><option value="Lowbed">${t('Lowbed','ناقلة منخفضة')}</option><option value="Refrigerated">${t('Refrigerated','مبردة')}</option></select></div><div class="field"><label>${t('Cargo weight','وزن الحمولة')}</label><input name="weight" placeholder="18 t" required/></div><div class="field"><label>${t('Pickup date and time','تاريخ ووقت التحميل')}</label><input name="pickup" type="datet function screenContent(){switch(state.screen){case'overview':return overview();case'marketplace':return market();case'shipments':return shipments();case'trips':return trips();case'fleet':return fleet();case'messages':return messages();case'finance':return finance();case'create':return create();default:return overview()}}
function go(s){state.screen=s;shell();window.scrollTo(0,0)}function setRole(r){state.role=r;state.screen=r==='driver'?'trips':r==='carrier'?'marketplace':'overview';shell();showToast(t('Switched to ','تم التبديل إلى ')+roleName())}function toggleLang(){state.lang=state.lang==='en'?'ar':'en';shell()}
function showToast(msg){let el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');clearTimeout(window.__toast);window.__toast=setTimeout(()=>el.classList.remove('show'),2800)}function notifyDemo(){showToast(t('You are all caught up. This is a sample notification.','لا توجد تنبيهات جديدة. هذا إشعار تجريبي.'))}
function openModal(title,body,footer){document.getElementById('modal-root').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="modal-head"><h3>${title}</h3><button class="close" onclick="closeModal()">×</button></div><div class="modal-body">${body}</div><div class="modal-foot">${footer||`<button class="btn" onclick="closeModal()">${t('Close','إغلاق')}</button>`}</div></div></div>`}function closeModal(){document.getElementById('modal-root').innerHTML=''}
function openOffer(id){let l=state.loads.find(x=>x.id===id);if(state.role==='shipper'){openModal(t('Load details','تفاصيل الحمولة'),`<div class="eyebrow">${id}</div><h2 style="margin:0 0 12px">${val(l.from)} → ${val(l.to)}</h2><p style="color:var(--muted);font-size:12px">${val(l.cargo)} · ${l.weight} · ${val(l.type)}</p><div class="info-box"><span>${t('Indicative transport rate','سعر النقل الاسترشادي')}</span><strong>OMR ${l.rate}</strong></div><p style="font-size:11px;color:var(--muted);line-height:1.6">${t('This is a sample load. In the real product, verified carriers would be able to respond with an offer or accept the fixed booking terms.','هذه حمولة تجريبية. في المنتج الفعلي سيتمكن الناقلون الموثقون من إرسال عرض أو قبول شروط الحجز الثابت.')}</p>`);return;}openModal(t('Submit transport offer','إرسال عرض نقل'),`<div class="demo-note" style="margin-bottom:14px">${t('Load','الحمولة')} ${id} · ${val(l.from)} → ${val(l.to)} · ${val(l.type)}</div><div class="field"><label>${t('Your transport offer (OMR)','عرض النقل الخاص بك (ريال عُماني)')}</label><input id="offer-rate" type="number" min="1" value="${l.rate}"/></div><div class="field" style="margin-top:12px"><label>${t('Availability note','ملاحظة التوفر')}</label><textarea id="offer-note" placeholder="${t('Truck availability, ETA to pickup, conditions…','توفر الشاحنة ووقت الوصول وشروط العرض…')}"></textarea></div>`,`<button class="btn" onclick="closeModal()">${t('Cancel','إلغاء')}</button><button class="btn primary" onclick="submitOffer('${id}')">${t('Send offer','إرسال العرض')}</button>`)}
function submitOffer(id){let rate=Number(document.getElementById('offer-rate').value);if(!rate||rate<=0){showToast(t('Enter a valid offer amount.','أدخل مبلغ عرض صحيحاً.'));return}state.offers.push({id,rate});closeModal();showToast(t('Your offer was added to the demo activity.','تمت إضافة عرضك إلى النشاط التجريبي.'));}
function createLoad(e){e.preventDefault();let f=new FormData(e.target);let from=f.get('from'),to=f.get('to');if(from===to){showToast(t('Pickup and delivery must be different.','يجب أن تختلف مدينتا التحميل والتسليم.'));return}const cities={Muscat:{en:'Muscat',ar:'مسقط'},Sohar:{en:'Sohar',ar:'صحار'},Duqm:{en:'Duqm',ar:'الدقم'},Nizwa:{en:'Nizwa',ar:'نزوى'},Salalah:{en:'Salalah',ar:'صلالة'}};const types={'Flatbed':{en:'Flatbed',ar:'سطحة'},'Curtain-side':{en:'Curtain-side',ar:'ستارة جانبية'},'Lowbed':{en:'Lowbed',ar:'ناقلة منخفضة'},'Refrigerated':{en:'Refrigerated',ar:'مبردة'}};let id='TL-'+(2412+state.loads.length);state.loads.unshift({id,from:cities[from],to:cities[to],cargo:{en:f.get('cargo'),ar:f.get('cargo')},type:types[f.get('type')],weight:f.get('weight'),distance:'—',rate:Number(f.get('rate')),unit:'OMR',pickup:{en:'Scheduled',ar:'موعد محدد'},status:'open',shipper:'Your company',verified:true});state.screen='marketplace';shell();showToast(t('Shipment published to the demo marketplace.','تم نشر الشحنة في السوق التجريبي.'))}
function advanceTrip(){let trip=state.trips[0];if(trip.progress<4){trip.progress++;shell();showToast(t('Trip milestone confirmed.','تم تأكيد مرحلة الرحلة.'))}else{trip.status='delivered';showPOD()}}
function showPOD(){openModal(t('Proof of delivery','إثبات التسليم'),`<div class="demo-note" style="margin-bottom:14px">${t('This is a simulated POD capture. A production driver app would capture recipient name, timestamp, signature and permitted photos.','هذا نموذج محاكاة لإثبات التسليم. سيسجل تطبيق السائق الفعلي اسم المستلم والتوقيت والتوقيع والصور المسموح بها.')}</div><div class="field"><label>${t('Recipient name','اسم المستلم')}</label><input id="pod-name" placeholder="${t('Enter recipient name','أدخل اسم المستلم')}" value="Warehouse receiver"/></div><div class="field" style="margin-top:12px"><label>${t('Delivery condition','حالة التسليم')}</label><select id="pod-condition"><option>${t('Received in good condition','تم الاستلام بحالة جيدة')}</option><option>${t('Shortage / discrepancy reported','تم الإبلاغ عن نقص أو اختلاف')}</option><option>${t('Damage reported','تم الإبلاغ عن تلف')}</option></select></div><div style="margin-top:14px;border:1px dashed #b9d2cc;border-radius:11px;padding:19px;text-align:center;color:var(--muted);font-size:11px">▧ ${t('Photo / signature capture area (demo)','مساحة تصوير / توقيع (تجريبية)')}</div>`,`<button class="btn" onclick="closeModal()">${t('Cancel','إلغاء')}</button><button class="btn primary" onclick="completePOD()">${t('Submit POD','إرسال إثبات التسليم')}</button>`)}
function completePOD(){closeModal();state.trips[0].progress=4;state.trips[0].status='delivered';shell();showToast(t('POD submitted in demo. Trip marked delivered pending review.','تم إرسال إثبات التسليم تجريبياً. تم وضع الرحلة بحالة تم التسليم بانتظار المراجعة.'))}
function showShipment(id){openModal(t('Shipment overview','ملخص الشحنة'),`<div class="eyebrow">${id}</div><h2 style="margin:0 0 10px">${t('Muscat → Sohar','مسقط ← صحار')}</h2><div class="trip-info"><div class="info-box"><span>${t('Transport status','حالة النقل')}</span><strong>${t('In transit','قيد النقل')}</strong></div><div class="info-box"><span>${t('Agreed rate','السعر المتفق عليه')}</span><strong>OMR 165</strong></div><div class="info-box"><span>${t('Assigned truck','الشاحنة المخصصة')}</span><strong>OM-4821</strong></div></div><p class="row-meta" style="margin-top:15px">${t('Click Trips & tracking to view milestones, driver assignment and delivery evidence.','انتقل إلى الرحلات والتتبع لمشاهدة المراحل وإسناد السائق وإثبات التسليم.')}</p>`,`<button class="btn" onclick="closeModal()">${t('Close','إغلاق')}</button><button class="btn primary" onclick="closeModal();go('trips')">${t('Open trip','فتح الرحلة')}</button>`)}

function payments(){return head(t('Conditional online payments','المدفوعات الإلكترونية المشروطة'),t('Transparent milestones and approvals before settlement.','شروط واضحة للمراحل والموافقات قبل التسوية.'))+`<div class="settings-grid"><section class="setting-card"><h3>${t('Payment lifecycle','دورة الدفع')}</h3><table class="mini-table"><tbody>${[[t('Booking confirmed','تأكيد الحجز'),t('Authorize payment or collect approved deposit','تفويض الدفع أو تحصيل عربون')],[t('Pickup verified','تأكيد التحميل'),t('Optional partial release if contract allows','صرف جزئي اختياري وفق العقد')],[t('POD approved','اعتماد إثبات التسليم'),t('Trigger settlement eligibility','بدء أهلية التسوية')],[t('Dispute opened','فتح نزاع'),t('Pause affected settlement','تعليق التسوية المعنية')]].map(x=>`<tr><td><strong>${x[0]}</strong></td><td>${x[1]}</td></tr>`).join('')}</tbody></table></section><section class="setting-card"><h3>${t('Illustrative booking · TL-2398','حجز توضيحي · TL-2398')}</h3><p>${t('Agreed transport price','قيمة النقل المتفق عليها')}</p><h2>OMR 165.000</h2><p>${t('Payment condition','شرط الدفع')}: ${state.settings.payment==='pod'?t('After approved POD','بعد اعتماد التسليم'):state.settings.payment==='prepaid'?t('Prepaid before dispatch','مسبقاً قبل الانطلاق'):t('Split deposit and POD','عربون والباقي بعد التسليم')}</p><div class="notice">${t('Simulated only. No real authorization, escrow, fund custody, transfer or refund occurs. Use a licensed payment provider for production.','محاكاة فقط، دون حجز أموال أو تحويل أو استرداد فعلي. يتطلب الإنتاج مزود دفع مرخصاً.')}</div><button class="btn primary" onclick="showToast(t('Demo payment condition reviewed; no funds moved.','تمت مراجعة شروط الدفع تجريبياً دون حركة أموال.'))">${t('Review conditions','مراجعة الشروط')}</button></section></div>`}

function settingsPage(){if(state.role!=='ops')return head(t('Restricted','مقيد'),t('Administrator access required.','هذه الصفحة للإدارة فقط.'));return head(t('Admin settings','إعدادات الإدارة'),t('Configure marketplace rules, payments, compliance, APIs and notifications.','ضبط قواعد السوق والمدفوعات والامتثال والتكاملات والتنبيهات.'))+`<div class="notice">${t('Investor demo only: changes apply in this browser session, not to a production system.','للعرض الاستثماري فقط: تنطبق التغييرات على جلسة المتصفح وليس على نظام إنتاجي.')}</div><div class="settings-grid"><section class="setting-card"><h3>${t('Marketplace & pricing','السوق والتسعير')}</h3><p>${t('Control commercial defaults and offer negotiation.','التحكم في إعدادات التسعير والتفاوض.')}</p><label>${t('Platform commission (%)','عمولة المنصة (%)')}</label><input id="s-commission" type="number" min="0" max="30" step="0.5" value="${state.settings.commission}">${settingField('currency',t('Settlement currency','عملة التسوية'),[['OMR','OMR']])}${toggleField('allowNegotiation',t('Allow counteroffers','السماح بالعروض المضادة'))}</section><section class="setting-card"><h3>${t('Payments & settlement','المدفوعات والتسويات')}</h3><p>${t('Conditions require contractual approval and a licensed gateway.','الشروط تتطلب اتفاقاً تعاقدياً ومزود دفع مرخصاً.')}</p>${settingField('payment',t('Default payment condition','شرط الدفع الافتراضي'),[['pod',t('After approved POD','بعد اعتماد إثبات التسليم')],['prepaid',t('Before dispatch','قبل الانطلاق')],['split',t('Deposit + POD','عربون + بعد التسليم')]])}<label>${t('Review window (days)','مدة المراجعة (أيام)')}</label><input id="s-holdDays" type="number" min="0" max="30" value="${state.settings.holdDays}">${toggleField('requirePOD',t('Require POD for settlement','اشتراط إثبات التسليم للتسوية'))}</section><section class="setting-card"><h3>${t('Compliance & dispatch','الامتثال والتشغيل')}</h3><p>${t('Protect vehicle assignments and transport documentation.','حماية تخصيص المركبات ووثائق النقل.')}</p>${toggleField('requireVerified',t('Require verified carriers and drivers','اشتراط التحقق من الناقل والسائق'))}${toggleField('autoDispatch',t('Enable auto-dispatch (demo only)','تفعيل الإسناد التلقائي تجريبياً'))}<label>${t('GPS update interval (minutes)','فاصل تحديث الموقع (دقائق)')}</label><input id="s-gpsMinutes" type="number" min="1" max="60" value="${state.settings.gpsMinutes}"></section><section class="setting-card"><h3>${t('Integrations & alerts','التكاملات والتنبيهات')}</h3><p>${t('Production credentials must never be stored in frontend code.','لا يجوز تخزين بيانات الاعتماد الحقيقية في واجهة المستخدم.')}</p>${toggleField('apiEnabled',t('Enable enterprise API requests','السماح بطلبات ربط الأنظمة'))}${toggleField('webhooks',t('Enable webhook subscriptions','تفعيل اشتراكات الإشعارات البرمجية'))}${toggleField('notifyEmail',t('Email alerts','تنبيهات البريد الإلكتروني'))}${toggleField('notifyPush',t('Mobile push alerts','تنبيهات الهاتف'))}</section></div><div class="settings-actions"><button class="btn" onclick="resetSettings()">${t('Reset defaults','استعادة الافتراضي')}</button><button class="btn primary" onclick="saveSettings()">${t('Save demo settings','حفظ الإعدادات التجريبية')}</button></div>`}
function saveSettings(){const keys=Object.keys(state.settings);const next={...state.settings};for(const k of keys){const e=document.getElementById('s-'+k);if(!e)continue;next[k]=e.type==='checkbox'?e.checked:e.type==='number'?Number(e.value):e.value}if(next.commission<0||next.commission>30||next.holdDays<0||next.holdDays>30||next.gpsMinutes<1||next.gpsMinutes>60){showToast(t('Please check the numeric ranges.','يرجى مراجعة نطاقات الأرقام.'));return}state.settings=next;showToast(t('Demo settings saved for this session.','تم حفظ الإعدادات لهذه الجلسة التجريبية.'));shell()}

screenContent=function(){if(state.screen==='profiles')return profiles();if(state.screen==='integrations')return integrations();if(state.screen==='payments')return payments();if(state.screen==='settings')return settingsPage();return oldScreenContent()};
