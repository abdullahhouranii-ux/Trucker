# Local development database only. Not a deployment definition.
# NOT EXECUTED in the session that wrote it (no Docker daemon was available); the same
# checks were run against a locally installed PostgreSQL 16. Verify on first use.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trucker
      POSTGRES_PASSWORD: trucker-local-only
      POSTGRES_DB: trucker_dev
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - trucker_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U trucker -d trucker_dev']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  trucker_pgdata:
